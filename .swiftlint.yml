strict: true
included:
  - Sources
  - Tests
  - kits/kit-swift/Sources
excluded:
  - .build
  - kits/kit-swift/.build
  - kits/kit-ts
  - invariants/.dev
disabled_rules:
  - trailing_comma
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - fatal_error_message
  - first_where
  - contains_over_filter_count
  - sorted_first_last
  - unowned_variable_capture
  - prefer_self_in_static_references
line_length:
  warning: 140
  error: 180
function_body_length:
  warning: 175
  error: 250
type_body_length:
  warning: 350
  error: 500
file_length:
  warning: 600
  error: 800
cyclomatic_complexity:
  warning: 25
  error: 45
  ignores_case_statements: true
identifier_name:
  min_length:
    warning: 1
    error: 1
  allowed_symbols:
    - "_"
  excluded:
    - id
    - fm
    - db
    - to
    - as
    - i
    - v
    - t
    - p
    - ts
    - ch
    - c
    - sH
    - cH
    - v1_0_0
    - v1_2_3
    - v2_0_0
    - v5
    - v6
